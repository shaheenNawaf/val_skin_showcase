<!DOCTYPE html>
<html lang="en" data-theme="protocol">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CardForge — Picker Lab B · Grouped Shelves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font-ui:'Inter',system-ui,sans-serif;--font-display:'Manrope','Inter',sans-serif;
  --notch:8px;--notch-lg:16px;
  --c-bg:#0B0F14;--c-surface:#10161D;--c-surface2:#151C24;
  --c-line:#222C37;--c-line-soft:#1A222C;--c-ink:#D9DCE0;--c-mut:#8A95A1;
  --c-accent:#FF4655;--c-accent-btn:#D62839;
  --t-select:#9ba8b9;--t-deluxe:#4aa8ff;--t-premium:#b44bf0;--t-ultra:#ff5d7b;--t-exclusive:#ffc45e;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html{background:var(--c-bg);scrollbar-width:thin;scrollbar-color:var(--c-line) transparent}
body{font-family:var(--font-ui);background:var(--c-bg);color:var(--c-ink)}
:focus{outline:none}
:focus-visible{box-shadow:inset 0 0 0 2px var(--c-accent)!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--c-line)}
::-webkit-scrollbar-thumb:hover{background:var(--c-accent)}
button,input{font-family:var(--font-ui)}
.t-select{--tc:var(--t-select)}
.t-deluxe{--tc:var(--t-deluxe)}
.t-premium{--tc:var(--t-premium)}
.t-ultra{--tc:var(--t-ultra)}
.t-exclusive{--tc:var(--t-exclusive)}

#topbar{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;background:var(--c-surface);border-bottom:1px solid var(--c-line);z-index:20}
.tb-left,.tb-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--font-display);font-weight:800;font-size:15px;letter-spacing:.18em;color:var(--c-ink)}
.logo::before{content:"";display:inline-block;width:9px;height:15px;background:var(--c-accent);transform:skewX(-20deg);margin-right:9px;vertical-align:-2px}
a.tb-link{background:transparent;border:1px solid var(--c-line-soft);color:var(--c-mut);padding:7px 14px;font:600 10px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer;clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%,0 var(--notch))}
a.tb-link:hover{border-color:var(--c-mut);color:var(--c-ink)}
.sib{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--c-line);color:var(--c-mut);font:700 11px var(--font-ui);text-decoration:none;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.sib:hover{border-color:var(--c-mut);color:var(--c-ink)}
.sib.cur{background:var(--c-accent-btn);border-color:var(--c-accent-btn);color:#fff}
.proto-chip{background:var(--c-accent-btn);color:#fff;font:700 10px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;padding:4px 10px;clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%,0 var(--notch))}

main{padding:76px 20px 120px;max-width:1200px;margin:0 auto}

.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.cat{background:transparent;border:1px solid var(--c-line);color:var(--c-mut);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;cursor:pointer;clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%,0 var(--notch))}
.cat b{font-weight:700;opacity:.72;margin-left:6px}
.cat:hover{border-color:var(--c-mut);color:var(--c-ink)}
.cat.on{background:var(--c-accent-btn);border-color:var(--c-accent-btn);color:#fff}

.controls{display:flex;gap:12px;margin-bottom:18px}
#q{flex:1;background:var(--c-surface2);border:1px solid var(--c-line);color:var(--c-ink);font-weight:500;font-size:13px;padding:10px 14px;clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%,0 var(--notch))}
#q::placeholder{color:var(--c-mut)}
#q:focus{border-color:var(--c-accent)}

.jump{position:fixed;right:14px;top:50%;transform:translateY(-50%);z-index:20;display:flex;flex-direction:column;gap:8px}
.jdot{background:transparent;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:3px;width:26px;cursor:pointer}
.jdot i{width:10px;height:10px;display:block;background:var(--tc,var(--c-mut));transform:rotate(45deg)}
.jdot b{font-weight:700;font-size:10px;color:var(--c-mut);font-variant-numeric:tabular-nums}
.jdot .jl{font-weight:700;font-size:9px;color:var(--c-mut);margin-top:2px}
.jdot:hover b{color:var(--c-ink)}
.jdot[hidden]{display:none}

.shelf{scroll-margin-top:64px}
.sh-head{position:sticky;top:60px;z-index:10;background:var(--c-bg);padding:8px 0;display:flex;align-items:center;gap:10px}
.sh-bar{width:4px;height:22px;background:var(--tc,var(--c-mut));clip-path:polygon(2px 0,100% 0,100% calc(100% - 2px),calc(100% - 2px) 100%,0 100%,0 2px)}
.sh-head h2{font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:.06em}
.sh-n{font-weight:600;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--c-mut)}
.rowwrap{position:relative}
.rowwrap::after{content:"";position:absolute;top:0;right:0;bottom:12px;width:36px;background:linear-gradient(90deg,transparent,var(--c-bg));pointer-events:none}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 12px}
.row .tile{flex:0 0 168px;scroll-snap-align:start}
.shelf.solo .row{overflow:visible}

.tile{position:relative;background:var(--c-surface);border:1px solid var(--c-line);border-top:2px solid var(--tc,var(--c-line));padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;clip-path:polygon(var(--notch-lg) 0,100% 0,100% calc(100% - var(--notch-lg)),calc(100% - var(--notch-lg)) 100%,0 100%,0 var(--notch-lg))}
.tile .ic{height:72px;display:flex;align-items:center;justify-content:center}
.tile .ic img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.55))}
.tile .nm{font-weight:600;font-size:12.5px;color:var(--c-ink);width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-weight:600;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-mut);width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .cnt{position:absolute;top:6px;right:6px;background:var(--c-accent-btn);color:#fff;font-weight:700;font-size:10px;padding:2px 6px}

@media (prefers-reduced-motion:no-preference){
  .tile{transition:transform .18s ease,border-color .18s ease}
  .tile:hover{transform:translateY(-2px);border-color:var(--tc,var(--c-line))}
  a.tb-link,.sib,.cat,.jdot b,.pempty button{transition:color .15s ease,border-color .15s ease}
}

#tray{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--c-surface);border-top:1px solid var(--c-line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tray-label{font-family:var(--font-display);font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.chip{display:flex;align-items:center;gap:8px;background:var(--c-surface2);border:1px solid var(--c-line);padding:4px 8px;clip-path:polygon(4px 0,100% 0,100% calc(100% - 4px),calc(100% - 4px) 100%,0 100%,0 4px)}
.chip img{width:22px;height:22px;object-fit:contain}
.chip .cn{font-size:11px;color:var(--c-ink)}
.chip .lv{background:transparent;border:1px solid var(--c-line);color:var(--c-ink);font-weight:700;font-size:10px;padding:2px 7px;cursor:pointer}
.chip .lv.on{border-color:var(--c-accent)}
.chip .rmv{background:transparent;border:0;color:var(--c-mut);font-size:14px;line-height:1;cursor:pointer;padding:0 2px}
.chip .rmv:hover{color:var(--c-accent)}

.pempty{text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--c-mut);font-size:14px}
.pempty button{background:transparent;border:1px solid var(--c-line);color:var(--c-ink);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:9px 14px;cursor:pointer;clip-path:polygon(var(--notch) 0,100% 0,100% calc(100% - var(--notch)),calc(100% - var(--notch)) 100%,0 100%,0 var(--notch))}
.pempty button:hover{border-color:var(--c-accent)}

.disc{margin-bottom:90px;font-size:11px;color:var(--c-mut);text-align:center;line-height:1.6}

@media (max-width:1099px){.jump{display:none}}
</style>
</head>
<body>
<!-- Picker Lab B -->
<header id="topbar">
  <div class="tb-left"><span class="logo">CARD FORGE</span></div>
  <div class="tb-right">
    <a class="tb-link" href="index.html">Hub</a>
    <a class="sib" href="picker-a.html">A</a>
    <a class="sib cur" href="picker-b.html">B</a>
    <a class="sib" href="picker-c.html">C</a>
    <span class="proto-chip">PICKER LAB · B</span>
  </div>
</header>

<nav class="jump" aria-label="Jump to tier shelf">
  <button type="button" class="jdot t-exclusive" data-tier="exclusive" aria-controls="shelf-exclusive" aria-label="Jump to Exclusive" title="Jump to Exclusive"><i></i><b></b><span class="jl">E</span></button>
  <button type="button" class="jdot t-ultra" data-tier="ultra" aria-controls="shelf-ultra" aria-label="Jump to Ultra" title="Jump to Ultra"><i></i><b></b><span class="jl">U</span></button>
  <button type="button" class="jdot t-premium" data-tier="premium" aria-controls="shelf-premium" aria-label="Jump to Premium" title="Jump to Premium"><i></i><b></b><span class="jl">P</span></button>
  <button type="button" class="jdot t-deluxe" data-tier="deluxe" aria-controls="shelf-deluxe" aria-label="Jump to Deluxe" title="Jump to Deluxe"><i></i><b></b><span class="jl">D</span></button>
  <button type="button" class="jdot t-select" data-tier="select" aria-controls="shelf-select" aria-label="Jump to Select" title="Jump to Select"><i></i><b></b><span class="jl">S</span></button>
</nav>

<main>
  <div class="cats" id="cats"></div>
  <div class="controls"><input id="q" type="search" placeholder="Search skins or weapons…" autocomplete="off" aria-label="Search skins"></div>
  <div id="content"></div>
  <p class="disc">CardForge is not affiliated with, endorsed by, or associated with Riot Games or any game publisher. All game names, skin names and imagery are trademarks/property of their respective owners. Picker lab prototype — mock catalog.</p>
</main>

<div id="tray">
  <b class="tray-label">ON CARD — <span id="trayCat"></span> (<span id="trayN"></span>)</b>
</div>

<script src="mock-data.js"></script>
<script>
(function(){
  var PINNED={Rifles:['Vandal','Phantom','Bulldog'],Sidearms:['Sheriff','Ghost','Frenzy'],SMGs:['Spectre','Stinger'],'Sniper Rifles':['Operator'],'Machine Guns':['Odin','Ares'],Melees:['Axe','Knife','Dagger','Catrina']};
  function catOf(name){
    var last=name.trim().split(/\s+/).pop();
    for(var c in PINNED){ if(PINNED[c].indexOf(last)>-1) return c; }
    return 'Rifles';
  }
  var TIER_ORDER=['select','deluxe','premium','ultra','exclusive'];
  var TIER_NAME={select:'SELECT',deluxe:'DELUXE',premium:'PREMIUM',ultra:'ULTRA',exclusive:'EXCLUSIVE'};
  var CATS=[{key:'Sidearms',label:'SIDEARMS'},{key:'SMGs',label:'SMGS'},{key:'Rifles',label:'RIFLES'},{key:'Sniper Rifles',label:'SNIPERS'},{key:'Machine Guns',label:'MGS'},{key:'Melees',label:'MELEES'}];
  var CATLABEL={}; CATS.forEach(function(c){CATLABEL[c.key]=c.label;});
  var CATALOG=Object.entries(CF_MOCK.skins).map(function(e){return Object.assign({key:e[0],cat:catOf(e[1].name)},e[1]);});

  var cat='Rifles';
  var q='';
  var picks={}; CATS.forEach(function(c){picks[c.key]=[];});

  function esc(v){return String(v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}

  function filtered(){
    var term=q.trim().toLowerCase();
    return CATALOG.filter(function(c){
      if(c.cat!==cat) return false;
      if(!term) return true;
      return (c.name+' '+c.cat).toLowerCase().indexOf(term)>-1;
    });
  }

  var catsEl=document.getElementById('cats');
  var contentEl=document.getElementById('content');
  var trayEl=document.getElementById('tray');
  var trayCat=document.getElementById('trayCat');
  var trayN=document.getElementById('trayN');
  var jumpEls=Array.prototype.slice.call(document.querySelectorAll('.jdot'));

  function renderCats(){
    catsEl.innerHTML=CATS.map(function(c){
      var n=CATALOG.filter(function(x){return x.cat===c.key;}).length;
      return '<button type="button" class="cat'+(c.key===cat?' on':'')+'" data-cat="'+esc(c.key)+'">'+esc(c.label)+'<b>'+n+'</b></button>';
    }).join('');
  }

  function renderJump(){
    var items=filtered();
    jumpEls.forEach(function(btn){
      var t=btn.getAttribute('data-tier');
      var n=items.filter(function(x){return x.tier===t;}).length;
      btn.hidden=n===0;
      btn.querySelector('b').textContent=n;
    });
  }

  function countFor(key){
    return picks[cat].filter(function(p){return p.key===key;}).length;
  }

  function tileHTML(c){
    var n=countFor(c.key);
    return '<button type="button" class="tile t-'+c.tier+'" data-key="'+esc(c.key)+'">'+
      '<span class="ic"><img src="'+esc(c.icon)+'" alt="" loading="lazy"></span>'+
      '<span class="nm">'+esc(c.name)+'</span>'+
      '<span class="sub">'+esc(c.cat)+' • '+esc(TIER_NAME[c.tier])+'</span>'+
      (n?'<span class="cnt">×'+n+'</span>':'')+
      '</button>';
  }

  function renderShelves(){
    var items=filtered();
    if(!items.length){
      contentEl.innerHTML='<div class="pempty"><span>No skins match your search.</span><button type="button" id="emptyClear">Clear search</button></div>';
      return;
    }
    var parts=[];
    TIER_ORDER.slice().reverse().forEach(function(t){
      var list=items.filter(function(x){return x.tier===t;}).sort(function(a,b){return a.name.localeCompare(b.name);});
      if(!list.length) return;
      parts.push('<section class="shelf'+(list.length<=2?' solo':'')+'" id="shelf-'+t+'"><div class="sh-head"><span class="sh-bar t-'+t+'"></span><h2>'+TIER_NAME[t]+'</h2><span class="sh-n">'+list.length+' skins</span></div><div class="rowwrap"><div class="row">'+list.map(tileHTML).join('')+'</div></div></section>');
    });
    contentEl.innerHTML=parts.join('');
  }

  function renderTray(){
    trayCat.textContent=CATLABEL[cat];
    trayN.textContent=picks[cat].length;
    Array.prototype.slice.call(trayEl.querySelectorAll('.chip')).forEach(function(el){el.remove();});
    picks[cat].forEach(function(p,i){
      var s=CATALOG.filter(function(x){return x.key===p.key;})[0];
      var chip=document.createElement('span');
      chip.className='chip';
      chip.innerHTML='<img src="'+esc(s.icon)+'" alt="" loading="lazy"><span class="cn">'+esc(s.name)+'</span>'+
        '<button type="button" class="lv'+(p.level>1?' on':'')+'" data-i="'+i+'">L'+p.level+'</button>'+
        '<button type="button" class="rmv" data-i="'+i+'" aria-label="Remove '+esc(s.name)+'">×</button>';
      trayEl.appendChild(chip);
    });
  }

  function render(){
    renderCats();
    renderJump();
    renderShelves();
    renderTray();
  }

  catsEl.addEventListener('click',function(e){
    var b=e.target.closest('.cat');
    if(!b) return;
    cat=b.getAttribute('data-cat');
    render();
  });

  document.getElementById('q').addEventListener('input',function(e){
    q=e.target.value;
    renderJump();
    renderShelves();
  });

  contentEl.addEventListener('click',function(e){
    if(e.target.closest('#emptyClear')){
      q='';
      document.getElementById('q').value='';
      renderJump();
      renderShelves();
      return;
    }
    var t=e.target.closest('.tile');
    if(!t) return;
    picks[cat].push({key:t.getAttribute('data-key'),level:1});
    renderShelves();
    renderTray();
  });

  trayEl.addEventListener('click',function(e){
    var lv=e.target.closest('.lv');
    if(lv){
      var li=parseInt(lv.getAttribute('data-i'),10);
      var p=picks[cat][li];
      p.level=p.level%5+1;
      renderTray();
      return;
    }
    var rmv=e.target.closest('.rmv');
    if(rmv){
      var ri=parseInt(rmv.getAttribute('data-i'),10);
      picks[cat].splice(ri,1);
      renderTray();
      return;
    }
  });

  jumpEls.forEach(function(btn){
    btn.addEventListener('click',function(){
      var el=document.getElementById('shelf-'+btn.getAttribute('data-tier'));
      if(!el) return;
      var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      el.scrollIntoView({behavior:reduced?'auto':'smooth',block:'start'});
    });
  });

  render();
})();
</script>
</body>
</html>
